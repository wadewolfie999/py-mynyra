# ACTIVE INDEX — reviewed, public-safe Py-Mynyra project briefing.
#
# This is the repository-owned active briefing index. It supersedes the earlier
# split working-copy arrangement after the reconciliation review is merged.
#
# This projection is not an authority, a source-body reader, a semantic truth
# validator, a command surface, or a live authorization grant.  The referenced
# documents own their detailed facts and decisions.  Regenerate and review this
# index through the normal source-and-index closeout workflow after a material
# source, decision, or coverage change.

schema_version = 1
project_id = "py-mynyra"
limitations = [
  "This is a curated public briefing index, not complete project history.",
  "Private artifacts, .local, account data, credentials, sealed data, catalog contents, and arbitrary conversations are outside this reader.",
  "A recorded action or approval is not a present authorization grant, and a recorded running state is not proof of a live process.",
  "Matching source hashes check reviewed byte identity; they do not validate the index paraphrases or establish coverage of uninspected records.",
  "A consistent snapshot means two bounded working-file collections agreed; it is not an atomic filesystem transaction or an immutable Git-blob read.",
  "The baseline identifier is a reviewed indexed reference, not a live local or remote Git revision check.",
  "Runtime file access is limited to direct public .md, .toml, and .json records in docs/ and experiments/; hidden paths, subdirectories, symbolic links, and multiply linked files are excluded. Public-file and index contents still require editorial review.",
  "The repository contains the reader and optional local adapter, but their presence does not prove host registration, shared operation, time savings, or a current remote Git revision.",
]

[coverage]
status = "partial"
# Focused wording/source review; this does not renew the uninspected contexts below.
reviewed_at = "2026-09-17T00:00:00Z"
reviewed_shared_baseline = "8d5081131af3b88cb45f554a2d730d7108ca8ddb"
remote_freshness = "not_checked"
uninspected_contexts = [
  "Conversations other than the specifically selected task records",
  "Private owner-constraint records and other .local state",
  "The normal ASUS execution machine and the Mac simulation environment",
  "Remote GitHub freshness after the reviewed shared baseline",
]

[inventory]
# Discovery reads file names and metadata/hashes only below these public roots;
# it never opens arbitrary record bodies to manufacture new claims.
roots = ["docs", "experiments"]
ignored = ["docs/PROJECT_STATE.toml"]


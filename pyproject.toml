[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-mynyra"
version = "0.1.0"
description = "Small, evidence-driven Python tools for a recoverable trading operation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ctrader-open-api==0.9.2",
    "service-identity==24.2.0",
]

[project.scripts]
mynyra = "mynyra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
